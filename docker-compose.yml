services:
  db:
    image: postgres:16-alpine
    container_name: packaginghype-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: packaginghype
      POSTGRES_PASSWORD: packaginghype
      POSTGRES_DB: packaginghype
    volumes:
      - packaginghype_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packaginghype -d packaginghype"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  packaginghype_pgdata:
